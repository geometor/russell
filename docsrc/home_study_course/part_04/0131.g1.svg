<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" class="euclid-graphic" data-graphic-id="0131.g1" data-folio="0131" data-graphic="g1">
  <title>Figure 18 — Undivided Equilibrium in a Closed Room</title>
  <desc>Perspective box representing undivided stillness with zero thermal division.</desc>
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
      --geom-pos: #e11d48;
      --geom-neg: #0284c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #ebe6dc;
        --geom-bg: #0c0e14;
        --geom-point-stroke: #0c0e14;
        --geom-poly-fill: #ebe6dc;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
        --geom-pos: #fb7185;
        --geom-neg: #38bdf8;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux, .geom-construction {
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.78;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-ray {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-linecap: round;
      fill: none;
      opacity: 0.82;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-zero {
      stroke: var(--geom-accent);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-zero-dashed {
      stroke: var(--geom-accent);
      stroke-width: 1.5;
      stroke-dasharray: 5, 4;
      stroke-linecap: round;
      fill: none;
    }
    .geom-pos {
      stroke: var(--geom-pos);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-neg {
      stroke: var(--geom-neg);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-neg-dashed {
      stroke: var(--geom-neg);
      stroke-width: 1.6;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      fill: none;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      fill: none;
      stroke: var(--geom-assert);
      stroke-width: 2.2;
      stroke-linecap: round;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-polygon-stroked {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.06;
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-zero-plane {
      fill: var(--geom-accent);
      fill-opacity: 0.12;
      stroke: var(--geom-accent);
      stroke-width: 1.5;
    }
    .geom-pos-fill {
      fill: var(--geom-pos);
      fill-opacity: 0.12;
      stroke: var(--geom-pos);
      stroke-width: 1.6;
    }
    .geom-neg-fill {
      fill: var(--geom-neg);
      fill-opacity: 0.12;
      stroke: var(--geom-neg);
      stroke-width: 1.6;
    }
    .wedge, .angle {
      fill: var(--geom-accent);
      fill-opacity: 0.24;
      stroke: var(--geom-accent);
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-dot {
      fill: var(--geom-fg);
      stroke: none;
    }
    .geom-point-zero {
      fill: var(--geom-bg);
      stroke: var(--geom-accent);
      stroke-width: 2.1;
    }
    .geom-point-pos {
      fill: var(--geom-bg);
      stroke: var(--geom-pos);
      stroke-width: 2.1;
    }
    .geom-point-neg {
      fill: var(--geom-bg);
      stroke: var(--geom-neg);
      stroke-width: 2.1;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-title {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: var(--geom-accent);
      text-anchor: middle;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon-stroked:hover, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 { marker-mid: url(#geom-tick-1); }
    path.geom-assert-active.geom-tick-2 { marker-mid: url(#geom-tick-2); }
    path.geom-assert-active.geom-tick-3 { marker-mid: url(#geom-tick-3); }
  </style>
