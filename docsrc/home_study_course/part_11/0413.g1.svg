<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 680" width="560" height="680" class="euclid-graphic" data-graphic-id="0413.g1" data-folio="0413" data-graphic="g1">
  <title>Figure 115 / 103 — Atomic and Solar Wave-Field Loops</title>
  <desc>Concentric elliptical orbits tilted across 1+-4+ / 4--1- planes resting on inert gas zero planes.</desc>
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
      --geom-pos: #e11d48;
      --geom-neg: #0284c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #ebe6dc;
        --geom-bg: #0c0e14;
        --geom-point-stroke: #0c0e14;
        --geom-poly-fill: #ebe6dc;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
        --geom-pos: #fb7185;
        --geom-neg: #38bdf8;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux, .geom-construction {
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.78;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-ray {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-linecap: round;
      fill: none;
      opacity: 0.82;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-zero {
      stroke: var(--geom-accent);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-zero-dashed {
      stroke: var(--geom-accent);
      stroke-width: 1.5;
      stroke-dasharray: 5, 4;
      stroke-linecap: round;
      fill: none;
    }
    .geom-pos {
      stroke: var(--geom-pos);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-neg {
      stroke: var(--geom-neg);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-neg-dashed {
      stroke: var(--geom-neg);
      stroke-width: 1.6;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      fill: none;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      fill: none;
      stroke: var(--geom-assert);
      stroke-width: 2.2;
      stroke-linecap: round;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-polygon-stroked {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.06;
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-zero-plane {
      fill: var(--geom-accent);
      fill-opacity: 0.12;
      stroke: var(--geom-accent);
      stroke-width: 1.5;
    }
    .geom-pos-fill {
      fill: var(--geom-pos);
      fill-opacity: 0.12;
      stroke: var(--geom-pos);
      stroke-width: 1.6;
    }
    .geom-neg-fill {
      fill: var(--geom-neg);
      fill-opacity: 0.12;
      stroke: var(--geom-neg);
      stroke-width: 1.6;
    }
    .wedge, .angle {
      fill: var(--geom-accent);
      fill-opacity: 0.24;
      stroke: var(--geom-accent);
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-dot {
      fill: var(--geom-fg);
      stroke: none;
    }
    .geom-point-zero {
      fill: var(--geom-bg);
      stroke: var(--geom-accent);
      stroke-width: 2.1;
    }
    .geom-point-pos {
      fill: var(--geom-bg);
      stroke: var(--geom-pos);
      stroke-width: 2.1;
    }
    .geom-point-neg {
      fill: var(--geom-bg);
      stroke: var(--geom-neg);
      stroke-width: 2.1;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-title {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: var(--geom-accent);
      text-anchor: middle;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon-stroked:hover, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 { marker-mid: url(#geom-tick-1); }
    path.geom-assert-active.geom-tick-2 { marker-mid: url(#geom-tick-2); }
    path.geom-assert-active.geom-tick-3 { marker-mid: url(#geom-tick-3); }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--geom-fg)" />
    </marker>
    <marker id="geom-arrow-pos" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--geom-pos)" />
    </marker>
    <marker id="geom-arrow-neg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--geom-neg)" />
    </marker>
  </defs>
  <g id="elements">
    <path id="frame-top" data-ref="[ F1 F2 ]" class="geom-line" d="M 10.00 10.00 L 280.00 10.00 L 550.00 10.00" />
    <path id="frame-right" data-ref="[ F2 F3 ]" class="geom-line" d="M 550.00 10.00 L 550.00 340.00 L 550.00 670.00" />
    <path id="frame-bottom" data-ref="[ F3 F4 ]" class="geom-line" d="M 550.00 670.00 L 280.00 670.00 L 10.00 670.00" />
    <path id="frame-left" data-ref="[ F4 F1 ]" class="geom-line" d="M 10.00 670.00 L 10.00 340.00 L 10.00 10.00" />
    <path id="axis-0" data-ref="[ Z0 Z1 ]" class="geom-zero-dashed" d="M 280.00 45.00 L 280.00 310.00 L 280.00 575.00" />
  </g>
  <g id="graphics">
    <ellipse id="orb-1" data-ref="( O R1 )" class="geom-pos" cx="280.00" cy="290.00" rx="18.00" ry="170.00" />
    <ellipse id="orb-2" data-ref="( O R2 )" class="geom-neg" cx="280.00" cy="290.00" rx="36.00" ry="185.00" />
    <ellipse id="orb-3" data-ref="( O R3 )" class="geom-pos" cx="280.00" cy="290.00" rx="54.00" ry="200.00" />
    <ellipse id="orb-4" data-ref="( O R4 )" class="geom-neg" cx="280.00" cy="290.00" rx="72.00" ry="215.00" />
    <ellipse id="inert-l" data-ref="( IL R )" class="geom-zero-plane" cx="145.00" cy="565.00" rx="95.00" ry="22.00" />
    <ellipse id="inert-r" data-ref="( IR R )" class="geom-zero-plane" cx="415.00" cy="565.00" rx="95.00" ry="22.00" />
    <circle id="sun" data-ref="( O S )" class="geom-pos-fill" cx="280.00" cy="245.00" r="18.00" />
  </g>
  <g id="highlights" style="pointer-events: none;">
  </g>
  <g id="points">
    <circle id="O" data-ref="O" class="geom-point-zero" cx="280.00" cy="245.00" r="5.00" />
  </g>
  <g id="labels">
    <text id="label-inl" data-ref="O" class="geom-label-sm" x="145.00" y="570.00" text-anchor="middle">ZERO • INERT GAS</text>
    <text id="label-inr" data-ref="O" class="geom-label-sm" x="415.00" y="570.00" text-anchor="middle">ZERO • INERT GAS</text>
    <text id="label-fig103" data-ref="O" class="geom-label-title" x="280.00" y="650.00" text-anchor="middle">FIG. 103</text>
  </g>
</svg>
