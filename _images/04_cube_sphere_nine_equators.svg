x="634" y="598" class="label-center label-small">8</text><circle cx="702" cy="562" r="18" class="node-neg"/><text x="702" y="562" class="label-center" style="font-size:13px;fill:#38bdf8;font-weight:800;">1+</text><text x="702" y="598" class="label-center label-small">9</text><circle cx="770" cy="562" r="18" class="node-zero"/><text x="770" y="562" class="label-center" style="font-size:13px;fill:#e8b85a;font-weight:800;">0</text><text x="770" y="598" class="label-center label-small">0</text>
  <text x="430" y="628" class="caption-text">1. Total count of equators = 9   •   2. Eight cube corners + centering zero = 9   •   3. Eight octant sections + centering zero = 9</text>
  <text x="430" y="646" class="caption-text">"THE UNIVERSAL EQUILIBRIUM IS PROTECTED BY WAVE-FIELD SYSTEMS OF NINE EQUATORS,</text>
  <text x="430" y="662" class="caption-text">WITHIN WHICH POLARIZATION EXPRESSES ITS OPPOSITION, BUT CANNOT PASS BEYOND."</text>

  <text x="28" y="736" class="fig-tag">FIG. 114</text>
