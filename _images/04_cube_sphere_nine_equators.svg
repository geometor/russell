  <text x="430.0" y="40" class="title-text">THE CUBE-SPHERE WAVE-FIELD OF NINE EQUATORS</text>
  <text x="430.0" y="58" class="subtitle-text">LESSON 43–45 • EIGHT OCTANTS AND EIGHT CORNERS CENTERED BY ZERO EQUAL NINE</text>
