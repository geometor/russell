<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460" class="euclid-graphic" data-graphic-id="0040.g1" data-folio="0040" data-graphic="g1">
  <title>Figure 5 — Concentration and Decentration</title>
  <desc>Radial dashed cone diverging from concentration apex through two concentric pressure arcs.</desc>
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
      --geom-pos: #e11d48;
      --geom-neg: #0284c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #ebe6dc;
        --geom-bg: #0c0e14;
        --geom-point-stroke: #0c0e14;
        --geom-poly-fill: #ebe6dc;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
        --geom-pos: #fb7185;
        --geom-neg: #38bdf8;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve, .geom-ellipse {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux, .geom-construction {
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.78;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-ray {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-linecap: round;
      fill: none;
      opacity: 0.82;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-zero {
      stroke: var(--geom-accent);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-zero-dashed {
      stroke: var(--geom-accent);
      stroke-width: 1.5;
      stroke-dasharray: 5, 4;
      stroke-linecap: round;
      fill: none;
    }
    .geom-pos {
      stroke: var(--geom-pos);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-neg {
      stroke: var(--geom-neg);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-neg-dashed {
      stroke: var(--geom-neg);
      stroke-width: 1.6;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      fill: none;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      fill: none;
      stroke: var(--geom-assert);
      stroke-width: 2.2;
      stroke-linecap: round;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-polygon-stroked {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.06;
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-zero-plane {
      fill: var(--geom-accent);
      fill-opacity: 0.12;
      stroke: var(--geom-accent);
      stroke-width: 1.5;
    }
    .geom-pos-fill {
      fill: var(--geom-pos);
      fill-opacity: 0.12;
      stroke: var(--geom-pos);
      stroke-width: 1.6;
    }
    .geom-neg-fill {
      fill: var(--geom-neg);
      fill-opacity: 0.12;
      stroke: var(--geom-neg);
      stroke-width: 1.6;
    }
    .wedge, .angle {
      fill: var(--geom-accent);
      fill-opacity: 0.24;
      stroke: var(--geom-accent);
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-dot {
      fill: var(--geom-fg);
      stroke: none;
    }
    .geom-point-zero {
      fill: var(--geom-bg);
      stroke: var(--geom-accent);
      stroke-width: 2.1;
    }
    .geom-point-pos {
      fill: var(--geom-bg);
      stroke: var(--geom-pos);
      stroke-width: 2.1;
    }
    .geom-point-neg {
      fill: var(--geom-bg);
      stroke: var(--geom-neg);
      stroke-width: 2.1;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-title {
      font-family: 'Fira Sans Condensed', 'Fira Sans', 'DejaVu Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: var(--geom-accent);
      text-anchor: middle;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon-stroked:hover, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 { marker-mid: url(#geom-tick-1); }
    path.geom-assert-active.geom-tick-2 { marker-mid: url(#geom-tick-2); }
    path.geom-assert-active.geom-tick-3 { marker-mid: url(#geom-tick-3); }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--geom-fg)" />
    </marker>
    <marker id="geom-arrow-pos" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--geom-pos)" />
    </marker>
    <marker id="geom-arrow-neg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="var(--geom-neg)" />
    </marker>
  </defs>
  <g id="elements">
    <path id="ray-0" data-ref="[ O R0 ]" class="geom-dashed" d="M 260.00 355.00 L 159.63 243.53 L 59.26 132.06" />
    <path id="ray-1" data-ref="[ O R1 ]" class="geom-dashed" d="M 260.00 355.00 L 194.24 220.18 L 128.49 85.36" />
    <path id="ray-2" data-ref="[ O R2 ]" class="geom-dashed" d="M 260.00 355.00 L 233.95 207.28 L 207.91 59.56" />
    <path id="ray-3" data-ref="[ O R3 ]" class="geom-dashed" d="M 260.00 355.00 L 260.00 205.00 L 260.00 55.00" />
    <path id="ray-4" data-ref="[ O R4 ]" class="geom-dashed" d="M 260.00 355.00 L 286.05 207.28 L 312.09 59.56" />
    <path id="ray-5" data-ref="[ O R5 ]" class="geom-dashed" d="M 260.00 355.00 L 325.76 220.18 L 391.51 85.36" />
    <path id="ray-6" data-ref="[ O R6 ]" class="geom-dashed" d="M 260.00 355.00 L 360.37 243.53 L 460.74 132.06" />
  </g>
  <g id="graphics">
    <path id="arc-0" data-ref="( O A0 )" class="geom-bold" d="M 143.33 238.33 A 165.00 165.00 0 0 1 376.67 238.33" />
    <path id="arc-1" data-ref="( O A1 )" class="geom-bold" d="M 111.51 206.51 A 210.00 210.00 0 0 1 408.49 206.51" />
    <path id="band-l" data-ref="/ P0L P1L /" class="geom-bold" d="M 143.33 238.33 L 127.42 222.42 L 111.51 206.51" />
    <path id="band-r" data-ref="/ P0R P1R /" class="geom-bold" d="M 376.67 238.33 L 392.58 222.42 L 408.49 206.51" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-band-l" data-ref="/ P0L P1L /" class="geom-line geom-overlay" d="M 143.33 238.33 L 127.42 222.42 L 111.51 206.51" />
    <path id="hl-band-r" data-ref="/ P0R P1R /" class="geom-line geom-overlay" d="M 376.67 238.33 L 392.58 222.42 L 408.49 206.51" />
  </g>
  <g id="points">
    <circle id="O" data-ref="O" class="geom-point-pos" cx="260.00" cy="355.00" r="4.00" />
    <circle id="P0L" data-ref="P0L" class="geom-point" cx="143.33" cy="238.33" r="3.00" />
    <circle id="P0R" data-ref="P0R" class="geom-point" cx="376.67" cy="238.33" r="3.00" />
    <circle id="P1L" data-ref="P1L" class="geom-point" cx="111.51" cy="206.51" r="3.00" />
    <circle id="P1R" data-ref="P1R" class="geom-point" cx="408.49" cy="206.51" r="3.00" />
  </g>
  <g id="labels">
    <text id="label-dec" data-ref="D" class="geom-label" x="260.00" y="95.00" text-anchor="middle">DECENTRATION</text>
    <text id="label-conc" data-ref="O" class="geom-label" x="260.00" y="395.00" text-anchor="middle">CONCENTRATION</text>
    <text id="label-fig" data-ref="O" class="geom-label-title" x="260.00" y="435.00" text-anchor="middle">Fig. 5</text>
  </g>
</svg>
