      fill-opacity: 0.12;
      stroke: var(--geom-pos);
      stroke-width: 1.6;
    }
    .geom-neg-fill {
      fill: var(--geom-neg);
      fill-opacity: 0.12;
      stroke: var(--geom-neg);
      stroke-width: 1.6;
    }
    .wedge, .angle {
      fill: var(--geom-accent);
      fill-opacity: 0.24;
      stroke: var(--geom-accent);
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.2;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-dot {
      fill: var(--geom-fg);
      stroke: none;
    }
    .geom-point-zero {
      fill: var(--geom-bg);
      stroke: var(--geom-accent);
      stroke-width: 2.1;
    }
    .geom-point-pos {
      fill: var(--geom-bg);
      stroke: var(--geom-pos);
      stroke-width: 2.1;
    }
    .geom-point-neg {
      fill: var(--geom-bg);
      stroke: var(--geom-neg);
      stroke-width: 2.1;
    }
