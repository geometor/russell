  <title>Figure 114 — Cube-Sphere Wave-Field of Nine Equators</title>
  <desc>Isometric cube divided by three orthogonal zero-planes with 27 zero nodes and 0-1-2-3-4-0-4-3-2-1-0 octave formula.</desc>
  <style>
