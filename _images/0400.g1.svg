      stroke-width: 1.4;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.78;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-ray {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-linecap: round;
      fill: none;
      opacity: 0.82;
