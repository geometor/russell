    }
    .geom-zero {
      stroke: var(--geom-accent);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-zero-dashed {
      stroke: var(--geom-accent);
      stroke-width: 1.5;
      stroke-dasharray: 5, 4;
      stroke-linecap: round;
      fill: none;
    }
    .geom-pos {
      stroke: var(--geom-pos);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-neg {
      stroke: var(--geom-neg);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-neg-dashed {
