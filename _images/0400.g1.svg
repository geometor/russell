      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
      --geom-pos: #e11d48;
      --geom-neg: #0284c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #ebe6dc;
        --geom-bg: #0c0e14;
        --geom-point-stroke: #0c0e14;
        --geom-poly-fill: #ebe6dc;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
        --geom-pos: #fb7185;
        --geom-neg: #38bdf8;
