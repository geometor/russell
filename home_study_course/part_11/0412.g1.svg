<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 680" width="580" height="680" class="euclid-graphic" data-graphic-id="0412.g1" data-folio="0412" data-graphic="g1">
  <title>Figures 124–125 — Wave-Shaft Double Spiral Inside Cube</title>
  <desc>Whirlpool double spiral along the diagonal wave-shaft of a cube (Fig. 124) and 3D cube-wave troughs/crests (Fig. 125).</desc>
