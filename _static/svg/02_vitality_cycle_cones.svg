  <path d="M 440.0 588.0 L 440.6 588.7 L 442.2 589.4 L 444.6 590.2 L 447.5 590.9 L 450.5 591.6 L 453.0 592.3 L 454.6 593.1 L 455.0 593.8 L 453.8 594.5 L 450.8 595.2 L 446.2 595.9 L 440.0 596.7 L 432.7 597.4 L 424.8 598.1 L 417.0 598.8 L 410.0 599.6 L 404.4 600.3 L 401.0 601.0 L 400.2 601.7 L 402.5 602.4 L 407.8 603.2 L 416.2 603.9 L 427.1 604.6 L 440.0 605.3 L 454.0 606.1 L 468.2 606.8 L 481.4 607.5 L 492.5 608.2 L 500.7 608.9 L 505.0 609.7 L 504.9 610.4 L 500.0 611.1 L 490.6 611.8 L 476.8 612.6 L 459.6 613.3 L 440.0 614.0 L 420.4 614.7 L 403.2 615.4 L 389.4 616.2 L 380.0 616.9 L 375.1 617.6 L 375.0 618.3 L 379.3 619.1 L 387.5 619.8 L 398.6 620.5 L 411.8 621.2 L 426.0 621.9 L 440.0 622.7 L 452.9 623.4 L 463.8 624.1 L 472.2 624.8 L 477.5 625.6 L 479.8 626.3 L 479.0 627.0 L 475.6 627.7 L 470.0 628.4 L 463.0 629.2 L 455.2 629.9 L 447.3 630.6 L 440.0 631.3 L 433.8 632.1 L 429.2 632.8 L 426.2 633.5 L 425.0 634.2 L 425.4 634.9 L 427.0 635.7 L 429.5 636.4 L 432.5 637.1 L 435.4 637.8 L 437.8 638.6 L 439.4 639.3 L 440.0 640.0" class="pos-line" style="stroke-width:1.4;"/>
